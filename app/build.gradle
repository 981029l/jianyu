import groovy.json.JsonSlurper

plugins { id 'com.android.application' }

def versionMeta = new JsonSlurper().parse(rootProject.file('version.json'))

android {
    namespace 'studio.jianyu.app'
    compileSdk 35
    defaultConfig {
        applicationId 'studio.jianyu.app'
        minSdk 26
        targetSdk 35
        versionCode versionMeta.versionCode as int
        versionName versionMeta.versionName as String
        def endpoint = providers.environmentVariable('JIANYU_IMAGE_ENDPOINT').getOrElse('').trim()
        if (endpoint) {
            def uri = new URI(endpoint)
            if (uri.scheme != 'https' || !uri.host || uri.userInfo || uri.query || uri.fragment) {
                throw new GradleException('JIANYU_IMAGE_ENDPOINT must be a public HTTPS endpoint URL without credentials, query, or fragment')
            }
        }
        buildConfigField 'String', 'IMAGE_ENDPOINT', groovy.json.JsonOutput.toJson(endpoint)
        def apiKeys = providers.environmentVariable('IMAGE_API_KEYS').getOrElse(
                providers.environmentVariable('IMAGE_API_KEY').getOrElse('')).trim()
        buildConfigField 'String', 'IMAGE_API_KEYS', groovy.json.JsonOutput.toJson(apiKeys)
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
