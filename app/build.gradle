import groovy.json.JsonSlurper

plugins { id 'com.android.application' }

def versionMeta = new JsonSlurper().parse(rootProject.file('version.json'))

android {
    namespace 'studio.jianyu.app'
    compileSdk 35
    defaultConfig {
        applicationId 'studio.jianyu.app'
        minSdk 26
        targetSdk 35
        versionCode versionMeta.versionCode as int
        versionName versionMeta.versionName as String
        def envMap = [:]
        def envFile = rootProject.file('.env')
        if (envFile.exists()) {
            envFile.eachLine { line ->
                def trimmed = line.trim()
                if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
                    def parts = trimmed.split('=', 2)
                    envMap[parts[0].trim()] = parts[1].trim()
                }
            }
        }

        def endpoint = providers.environmentVariable('JIANYU_IMAGE_ENDPOINT').getOrElse(envMap['JIANYU_IMAGE_ENDPOINT'] ?: '').trim()
        if (endpoint) {
            def uri = new URI(endpoint)
            if (uri.scheme != 'https' || !uri.host || uri.userInfo || uri.query || uri.fragment) {
                throw new GradleException('JIANYU_IMAGE_ENDPOINT must be a public HTTPS endpoint URL without credentials, query, or fragment')
            }
        }
        buildConfigField 'String', 'IMAGE_ENDPOINT', groovy.json.JsonOutput.toJson(endpoint)

        // 线路 1 密钥（通过 GitHub Secrets / 环境变量安全注入，本地离线开发兜底读取 .env）
        def apiKeysLine1 = providers.environmentVariable('IMAGE_API_KEYS').getOrElse(
                providers.environmentVariable('IMAGE_API_KEY').getOrElse(envMap['IMAGE_API_KEYS'] ?: '')).trim()
        buildConfigField 'String', 'IMAGE_API_KEYS', groovy.json.JsonOutput.toJson(apiKeysLine1)

        // 线路 2 密钥（通过 GitHub Secrets / 环境变量安全注入，本地离线开发兜底读取 .env）
        def apiKeysLine2 = providers.environmentVariable('IMAGE_API_KEYS_V2').getOrElse(
                providers.environmentVariable('IMAGE_API_KEY_V2').getOrElse(envMap['IMAGE_API_KEYS_V2'] ?: '')).trim()
        buildConfigField 'String', 'IMAGE_API_KEYS_V2', groovy.json.JsonOutput.toJson(apiKeysLine2)
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
