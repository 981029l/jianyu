name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - name: Assemble debug APK
        env:
          JIANYU_IMAGE_ENDPOINT: ${{ vars.JIANYU_IMAGE_ENDPOINT }}
          IMAGE_API_KEYS: ${{ secrets.IMAGE_API_KEYS }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: Jianyu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
